<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="A clean grade tracker for students.">
<title>Gradebook — Student Grade Tracker</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#"><span class="brand-mark">G</span><span>gradebook<span class="dot">.</span><small>STUDENT WORKSPACE</small></span></a>
    <div class="side-label">WORKSPACE</div>
    <nav>
      <button class="nav-link active" data-page="overview"><span>▦</span> Overview</button>
      <button class="nav-link" data-page="courses"><span>▤</span> My courses</button>
      <button class="nav-link" data-page="calculator"><span>⌁</span> Goal simulator</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="sync-status"><span class="status-dot"></span><span id="sync-label">Saved on this device</span></div>
      <button class="nav-link" id="export-data"><span>⇩</span> Export backup</button>
      <label class="nav-link import-label"><span>⇧</span> Import backup<input id="import-data" type="file" accept="application/json" hidden></label>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">YOUR ACADEMIC COMMAND CENTER</div><h1 id="page-title">Overview</h1></div>
      <div class="top-actions"><span class="local-pill"><i></i> Local mode</span><button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">☀</button><button class="avatar" title="Local profile">M</button></div>
    </header>
    <section id="page-content" aria-live="polite"></section>
    <footer>GRADEBOOK <span>·</span> BUILT FOR YOUR NEXT ACADEMIC W</footer>
  </main>
</div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body></html>
